name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk output/CheremoSphere.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheremoSphere-APK
          path: output/CheremoSphere.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "CheremoSphere Mobile App v1.0.0 (Android APK)"
          body: |
            ### CheremoSphere Official Android App
            Download the APK directly to your phone to install CheremoSphere.
            
            **Founder:** Japhet Cheremo  
            **Version:** 1.0.0  
            **Package:** com.cheremosphere.app
          files: output/CheremoSphere.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
