name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android-app
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts
        run: |
          mkdir -p output_artifacts
          APK_FILE=$(find android-app/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output_artifacts/CheremoSphere.apk
            echo "Copied APK: $APK_FILE"
          fi
          ls -la output_artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheremoSphere-APK
          path: output_artifacts/CheremoSphere.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: CheremoSphere Android App v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 📱 CheremoSphere Official Android Mobile App
            
            **Tagline:** Your skills. Your opportunities. All in one place.  
            **Brand Slogan:** Jobs. Connect. Market. Grow.  
            **Project Owner:** Japhet Cheremo
            
            ### 🚀 Features Included in this Release:
            - **Jobs & Recruitment Pipeline**: Search, filter, and apply for verified vacancies in Kenya.
            - **Dedicated "Ask for a Job" Section**: Reverse recruitment where candidates broadcast skills directly to employers.
            - **Marketplace & Products**: Discover and purchase electronics, agriculture, fashion, and business items.
            - **Freelance & Professional Services**: Hire vetted service providers and freelancers.
            - **Direct WhatsApp & Phone Integration**: Instant communication with employers, sellers, and platform support (+254719678760).
            - **Camera & File Chooser Support**: Upload CVs, resumes (PDF/Word), and product images directly from your phone.
            - **Native Splash Screen & Offline Mode**: Fast load times with pull-to-refresh and back-button navigation.
            
            ### 📥 Download & Install Instructions:
            1. Download **`CheremoSphere.apk`** below onto your Android phone.
            2. If prompted, allow "Install from unknown sources" in settings.
            3. Open and launch CheremoSphere!
          files: |
            output_artifacts/CheremoSphere.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
