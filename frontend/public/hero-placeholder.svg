<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#E6EBF2"/>
    </linearGradient>
    <linearGradient id="orbitG" x1="250" y1="450" x2="550" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#FF7A00"/>
    </linearGradient>
    <radialGradient id="sphereG" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="65%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D95C00"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D2A5C" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.4" stroke="#0D2A5C" stroke-width="0.5" stroke-dasharray="4 4">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- Central Orbital Sphere Visual -->
  <g transform="translate(400, 270)">
    <!-- Back orbit -->
    <path d="M -140,80 C -190,40 -120,-80 20,-110 C 140,-130 220,-80 220,-20" stroke="url(#orbitG)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Central Modern 'C' Hub -->
    <circle cx="0" cy="0" r="105" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <path d="M 40 -35 C 30 -55 12 -65 -15 -65 C -55 -65 -85 -35 -85 5 C -85 45 -55 75 -15 75 C 15 75 35 60 45 40 L 22 32 C 16 46 0 54 -15 54 C -42 54 -63 32 -63 5 C -63 -22 -42 -44 -15 -44 C 0 -44 14 -36 22 -22 Z" fill="#0D2A5C"/>

    <!-- Front orbit -->
    <path d="M 220,-20 C 220,50 140,120 10,135 C -100,150 -180,120 -140,80" stroke="url(#orbitG)" stroke-width="9" stroke-linecap="round"/>

    <!-- Orange Orb -->
    <circle cx="160" cy="-45" r="24" fill="url(#sphereG)"/>
    <circle cx="152" cy="-52" r="7" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Floating Opportunity Cards representing the ecosystem -->
  <!-- Card 1: Jobs & Careers -->
  <g transform="translate(110, 110)" filter="url(#cardShadow)">
    <rect width="210" height="74" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="37" r="18" fill="#F4F7FB"/>
    <path d="M 28 34 L 44 34 L 44 44 L 28 44 Z M 32 34 L 32 30 C 32 28 34 26 36 26 C 38 26 40 28 40 30 L 40 34" stroke="#0D2A5C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="64" y="32" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#0D2A5C">Verified Jobs</text>
    <text x="64" y="50" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#16A34A">● 1,400+ Active Roles</text>
  </g>

  <!-- Card 2: Professional Freelancers -->
  <g transform="translate(480, 80)" filter="url(#cardShadow)">
    <rect width="220" height="74" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="37" r="18" fill="#F4F7FB"/>
    <path d="M 36 26 A 6 6 0 1 0 36 38 A 6 6 0 1 0 36 26 M 26 48 C 26 42 31 39 36 39 C 41 39 46 42 46 48" stroke="#FF7A00" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="64" y="32" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#0D2A5C">Skilled Freelancers</text>
    <text x="64" y="50" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#24344D" opacity="0.8">Direct WhatsApp Connect</text>
  </g>

  <!-- Card 3: Marketplace & Products -->
  <g transform="translate(80, 420)" filter="url(#cardShadow)">
    <rect width="230" height="74" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="37" r="18" fill="#F4F7FB"/>
    <path d="M 28 30 L 44 30 L 42 45 L 30 45 Z M 33 30 C 33 26 39 26 39 30" stroke="#FF7A00" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <text x="64" y="32" font-family="'Poppins', sans-serif" font-weight="700" font-size="13" fill="#0D2A5C">Marketplace & Trade</text>
    <text x="64" y="50" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#24344D" opacity="0.8">Nairobi, Mombasa & Beyond</text>
  </g>

  <!-- Card 4: Official Owner Upload Placeholder Notice -->
  <g transform="translate(470, 430)" filter="url(#cardShadow)">
    <rect width="250" height="74" rx="14" fill="#0D2A5C"/>
    <circle cx="36" cy="37" r="18" fill="rgba(255,255,255,0.1)"/>
    <path d="M 36 27 L 36 41 M 30 33 L 36 27 L 42 33 M 28 45 L 44 45" stroke="#FF7A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="32" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Official Hero Asset Ready</text>
    <text x="64" y="49" font-family="'Poppins', sans-serif" font-weight="500" font-size="10.5" fill="#FF7A00">Replaceable via Owner Upload</text>
  </g>

  <text x="400" y="570" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="12" fill="#24344D" opacity="0.7">
    CheremoSphere Digital Ecosystem • Official Visual Asset Placeholder
  </text>
</svg>
