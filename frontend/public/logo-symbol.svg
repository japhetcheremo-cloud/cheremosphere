<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="orbitGrad" x1="15" y1="95" x2="105" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFA84A"/>
      <stop offset="70%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D95C00"/>
    </radialGradient>
    <filter id="sphereGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF7A00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Back half of orbital ring -->
  <path d="M 22,78 C 16,68 24,46 45,36 C 68,25 90,28 97,38" 
        stroke="url(#orbitGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 0"/>

  <!-- Bold Modern Geometric Letter 'C' in Navy Blue -->
  <path d="M 82 42 
           C 76 31, 65 24, 52 24 
           C 32 24, 18 39, 18 60 
           C 18 81, 32 96, 52 96 
           C 66 96, 78 88, 83 76 
           L 70 72 
           C 66 79, 59 83, 52 83 
           C 39 83, 31 72, 31 60 
           C 31 48, 39 37, 52 37 
           C 60 37, 67 42, 70 48 
           Z" 
        fill="#0D2A5C"/>

  <!-- Front half of orbital ring crossing through the C -->
  <path d="M 97,38 C 104,48 96,70 75,82 C 54,93 30,90 22,78" 
        stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Vibrant Orange Sphere positioned along the front orbit -->
  <circle cx="88" cy="46" r="10.5" fill="url(#sphereGrad)" filter="url(#sphereGlow)"/>
  <!-- Highlight point on sphere -->
  <circle cx="85" cy="43" r="3" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
