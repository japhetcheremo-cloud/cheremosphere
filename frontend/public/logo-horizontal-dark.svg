<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="orbitGradHDark" x1="15" y1="95" x2="105" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#FF7A00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <radialGradient id="sphereGradHDark" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFA84A"/>
      <stop offset="70%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D95C00"/>
    </radialGradient>
    <filter id="sphereGlowHDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF7A00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Symbol Group -->
  <g transform="translate(10, 0)">
    <!-- Back orbit -->
    <path d="M 22,78 C 16,68 24,46 45,36 C 68,25 90,28 97,38" 
          stroke="url(#orbitGradHDark)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Capital 'C' in Pure White -->
    <path d="M 82 42 
             C 76 31, 65 24, 52 24 
             C 32 24, 18 39, 18 60 
             C 18 81, 32 96, 52 96 
             C 66 96, 78 88, 83 76 
             L 70 72 
             C 66 79, 59 83, 52 83 
             C 39 83, 31 72, 31 60 
             C 31 48, 39 37, 52 37 
             C 60 37, 67 42, 70 48 
             Z" 
          fill="#FFFFFF"/>

    <!-- Front orbit -->
    <path d="M 97,38 C 104,48 96,70 75,82 C 54,93 30,90 22,78" 
          stroke="url(#orbitGradHDark)" stroke-width="5" stroke-linecap="round"/>

    <!-- Orange Sphere -->
    <circle cx="88" cy="46" r="10.5" fill="url(#sphereGradHDark)" filter="url(#sphereGlowHDark)"/>
    <circle cx="85" cy="43" r="3" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <!-- CHEREMO in White #FFFFFF, SPHERE in Vibrant Orange #FF7A00 -->
  <text x="135" y="72" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="44" letter-spacing="1.5" fill="#FFFFFF">CHEREMO<tspan fill="#FF7A00">SPHERE</tspan></text>
  
  <!-- Tagline / Slogan -->
  <text x="138" y="94" font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" font-weight="600" font-size="13" letter-spacing="3.2" fill="#E6EBF2" opacity="0.85">JOBS • CONNECT • MARKET • GROW</text>
</svg>
